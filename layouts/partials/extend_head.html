<!-- Service-worker removal backup: this site ships no worker (see static/sw.js).
     If an old one (e.g. ex-Jekyll) still controls this origin, drop it and
     its caches on page load. Harmless when nothing is registered. -->
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(function (regs) {
    regs.forEach(function (reg) {
      reg.unregister();
    });
  });
  if (window.caches) {
    caches.keys().then(function (keys) {
      keys.forEach(function (key) {
        caches.delete(key);
      });
    });
  }
}
</script>
